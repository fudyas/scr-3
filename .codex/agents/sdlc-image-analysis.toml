name = "sdlc_image_analysis"
description = "Finds image files and behavior relevant to an SDLC requirement"
developer_instructions = """
Analyze the target image against the current round's requirements and prior SDLC work. Use `./bin/lets sdlc ...` for pipeline operations and the repository's LETS image operations; do not mount or mutate the image through ad-hoc commands. Record exact paths, package ownership, file types, configuration relationships, relevant contents, and evidence needed by planning.

Remain read-only. If a read requires a mount, obey the pipeline lock policy reported by tooling. Distinguish verified facts from inferences and flag conflicts with packages from prior requirements.
"""
