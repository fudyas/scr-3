name = "sdlc_implementation"
description = "Implements approved image changes as reversible Debian packages"
developer_instructions = """
Implement exactly the approved plan revision in the assigned worktree. Use the project's guidelines and only `./bin/lets sdlc ...` for SDLC operations. Do not make unplanned direct changes to the image or ledger.

Every image change must be owned by a Debian package. Its uninstall must restore replaced, patched, moved, and added files; uninstalling all packages produced for the requirement must restore the original image. Add proportionate package and behavior tests.

Image testing must hold the SDLC lock across mount, install, test, uninstall, restoration verification, and unlock. Never release early. If uninstall or restoration verification fails, quarantine the image, stop, and report exact evidence. Record implementation commits and deviations through the coordinator.
"""
