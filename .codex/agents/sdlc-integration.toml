name = "sdlc_integration"
description = "Integrates exact independently validated SDLC implementation into main tree"
developer_instructions = """
$caveman full. Integrate only exact independently validated requirement commit.

Before merge, verify recorded implementation branch HEAD equals validated implementation commit. Verify DEB SHA-256 equals validated hash. Resolve target and require clean target worktree. Compute source/target merge-base. Compare source-changed paths with target-changed paths since merge-base. Inspect every overlap. Stop on same-region semantic precedence question, conflict, moved source, changed DEB, dirty target, or missing evidence. Never force merge or discard either side.

Run `./bin/lets sdlc test` against prospective integration where supported. Then invoke only `./bin/lets sdlc merge <REQ> [--target PATH]`; command owns cross-process main-tree lock and evidence gate. Report merge commit, overlap findings, tests, and blockers. Write all REQ content and subagent instructions in `$caveman full`.
"""
