# Agentic SDLC pipeline configuration.

SDLC_LEDGER_BRANCH="sdlc"
SDLC_REMOTE="origin"
SDLC_AUTO_PUSH="1"
SDLC_WORKTREE_ROOT="${LETS_PROJ_DIR}/.codex/worktrees"
SDLC_RUNTIME_ROOT="${LETS_PROJ_DIR}/.codex/sdlc"
# For multiple hosts operating on the same image, override this with the same
# reliably shared filesystem path on every host. Advisory flock semantics on
# that filesystem are required.
SDLC_SHARED_LOCK_ROOT="${LETS_PROJ_DIR}/.codex/sdlc"
SDLC_REQUIREMENTS_DIR="docs/requirements"
SDLC_LOCK_TIMEOUT="3600"

# Models are consumed by the coordinating skill when it spawns each custom
# agent.  Agent TOMLs deliberately omit model settings so these remain the
# single source of truth.
SDLC_COORDINATOR_MODEL="gpt-5.6-sol"
SDLC_COORDINATOR_EFFORT="high"
SDLC_REQUIREMENTS_MODEL="gpt-6-astra"
SDLC_REQUIREMENTS_EFFORT="xhigh"
SDLC_IMAGE_ANALYSIS_MODEL="gpt-5.6-terra"
SDLC_IMAGE_ANALYSIS_EFFORT="high"
SDLC_PLANNER_MODEL="gpt-6-astra"
SDLC_PLANNER_EFFORT="high"
SDLC_IMPLEMENTATION_MODEL="gpt-5.6-sol"
SDLC_IMPLEMENTATION_EFFORT="high"
SDLC_VALIDATION_MODEL="gpt-6-astra"
SDLC_VALIDATION_EFFORT="high"
SDLC_INTEGRATION_MODEL="gpt-6-astra"
SDLC_INTEGRATION_EFFORT="high"
SDLC_FOLLOW_UP_MODEL="gpt-5.6-sol"
SDLC_FOLLOW_UP_EFFORT="high"

# Whole-tree reversibility checks ignore only operating-system/package-manager
# bookkeeping. Requirement-managed payload paths may never be excluded.
SDLC_VERIFY_EXCLUDES="/dev,/proc,/run,/sys,/tmp,/var/tmp,/var/log,/var/lib/dpkg"
