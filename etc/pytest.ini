[pytest]
testpaths = tests
asyncio_mode = auto
markers =
    system: end-to-end black-box test that hits a running docker stack
    system_slm: system test that requires only slm
    system_indexing: system test that requires pg + slm + indexing
    system_retrieval: system test that requires pg + slm + prompting + retrieval
    system_prompting: system test that requires pg (+ the Prompting gateway/coordination seams, no service healthz)
    system_inference: system test that requires pg + slm + inference
    system_authoring: system test that requires the full stack (incl. authoring)
    system_claims: system test that requires pg + claims
    system_conflicts: system test that requires pg + claims + authoring + prompting + conflicts
    system_handoff: system test that requires pg + claims + handoff
    system_notification: system test that requires pg + claims + conflicts + handoff + notification
    system_accounts: system test that requires pg + accounts
    system_maintenance: system test that requires only pg (the Maintenance reaper trims the infra tables)
    system_analytics: system test that requires pg + analytics
    system_infra: system test that requires only pg (cross-cutting infra: event queue / lease / outbox / breaker / schema latch / role grants / codegen guard)
    system_sae: end-to-end test over the whole live SAE stack (all engine services + pg + the durable queue)
    system_chaos: M7 robustness test over the whole live SAE stack — kills + restarts engine services to prove durable-queue recovery
    system_pgbouncer: opt-in Phase-2 analogue — runs a pgbouncer (transaction pooling) in front of pg to prove xact advisory locks are RDS-Proxy-safe
    phase2_analogue: lower-priority forward-looking guard for a Phase-2 deployment surface, not a current-runtime gate
filterwarnings =
    ignore::DeprecationWarning
