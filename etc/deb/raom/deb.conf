# Trusted LETS mappings: dpkg owns operational paths directly.
STAGE_DIR=build/scr-raom
ARCHIVE_DIR=src/pkg
MAINTAINER_COMMON=etc/deb/raom/package-common.sh
INCLUDE_FILES="
etc/deb/raom/control:build/scr-raom/DEBIAN/control
etc/deb/raom/conffiles:build/scr-raom/DEBIAN/conffiles
etc/deb/raom/preinst:build/scr-raom/DEBIAN/preinst
etc/deb/raom/postinst:build/scr-raom/DEBIAN/postinst
etc/deb/raom/prerm:build/scr-raom/DEBIAN/prerm
etc/deb/raom/postrm:build/scr-raom/DEBIAN/postrm
src/:build/scr-raom/usr/local/scr/
etc/deb/raom/root/:build/scr-raom/
src/tools/resets-monitor/src/scr-resets-monitor.init:build/scr-raom/etc/init.d/scr-resets-monitor
src/tools/resets-monitor/etc/logrotate.conf:build/scr-raom/etc/logrotate.d/scr-resets-monitor
src/tools/raom/src/scr-raom.init:build/scr-raom/etc/init.d/scr-raom
src/tools/raom/etc/default-policy.conf:build/scr-raom/etc/default/scr-raom
src/tools/raom/etc/safe.monitrc:build/scr-raom/etc/monit/raom/safe.monitrc
src/tools/raom/etc/compat/monit.init:build/scr-raom/etc/init.d/monit
src/tools/raom/etc/compat/watchdog.init:build/scr-raom/etc/init.d/watchdog
src/tools/raom/etc/compat/monitrc:build/scr-raom/etc/monitrc
src/tools/raom/etc/compat/monitstate.sh:build/scr-raom/sbin/monitstate.sh
src/tools/raom/etc/compat/rc.local:build/scr-raom/etc/rc.local
"
# Generated archives must never enter the packaged src/ subtree.
EXCLUDE_FILES='/pkg/'
# The dpkg alternatives link for wd_keepalive uses the adapter in the src/ mapping.
# A direct archive entry here would let dpkg unlink the restored original on downgrade.
