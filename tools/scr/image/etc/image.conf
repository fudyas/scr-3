# scr image tools configuration file.
# NOTE: sourced by the mount/umount tools via ${LETS_TOOL_ETC_DIR}/image.conf.
# Any value here overrides the built-in default set in src/common.sh.

# Mount point where the image filesystem becomes accessible. A project-local,
# gitignored directory (image/) so the mounted tree stays inside the checkout.
# There can be only one image mounted at a time.
SCR_IMAGE_MOUNT_POINT="${LETS_PROJ_DIR}/image"

# State directory (holds the mount.state descriptor and the decompressed
# backing file). Lives under the project .lets state tree, which is gitignored.
SCR_IMAGE_STATE_DIR="${LETS_STATE_DIR}/scr/image"

# Directory for the transient decompressed backing file. A gzipped source
# image is left untouched on disk; only this working copy is inflated so the
# original stays compressed.
SCR_IMAGE_WORK_DIR="${SCR_IMAGE_STATE_DIR}/work"
