/var/log/scr/resets.jsonl /var/log/scr/resets-monitor.log {
    missingok
    notifempty
    nocopytruncate
    create 0600 root root
    sharedscripts
    firstaction
        /usr/local/scr/tools/resets-monitor/src/rotation-hooks begin
    endscript
    lastaction
        /usr/local/scr/tools/resets-monitor/src/rotation-hooks end
    endscript
}
