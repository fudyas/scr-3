# Client policy installed as /etc/default/scr-raom. Data only: unquoted KEY=value.
# All six keys are required. Invalid data discards the complete configuration.
# MAX_RESETS counts resets (0..2147483647). Both durations use seconds (1..2147483647).
MAX_RESETS=5
RESET_WINDOW_SECONDS=900
NTP_SYNC_TIMEOUT_SECONDS=60
SAFE_MODE_ON_ERROR=true
SAFE_PROFILE=/etc/monit/raom/safe.monitrc
NORMAL_PROFILE=/etc/monit/monitrc
