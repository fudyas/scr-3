# Install as /etc/default/scr-raom. Data only: unquoted KEY=value lines.
# All six keys are required. Invalid data discards the complete configuration.
# N counts resets (0..2147483647). M and K are seconds (1..2147483647).
N=5
M=900
K=60
SAFE_MODE_ON_ERROR=true
SAFE_PROFILE=/etc/monit/raom/safe.monitrc
NORMAL_PROFILE=/etc/monit/monitrc
