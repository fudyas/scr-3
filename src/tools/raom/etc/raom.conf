# Trusted internal paths, loaded by tool.sh. Never source client policy here.
# Assign every path explicitly so ambient environment cannot redirect production.
RAOM_POLICY_FILE=/etc/default/scr-raom
RAOM_STATE_DIR=/run/scr-raom
RAOM_BOOT_ID_FILE=/proc/sys/kernel/random/boot_id
RAOM_UPTIME_FILE=/proc/uptime
RAOM_RESETS_MONITOR=/usr/bin/scr-resets-monitor
RAOM_NTP_QUERY=/usr/bin/ntpq
RAOM_STATE_UID=0

# Native MONIT and boot-service interfaces. MONIT alone supervises services.
RAOM_MONIT_BINARY=/usr/bin/monit
RAOM_START_STOP_DAEMON=/sbin/start-stop-daemon
RAOM_MONIT_DEFAULTS_FILE=/etc/default/monit
RAOM_KEEPALIVE_INIT=/etc/init.d/wd_keepalive
RAOM_KEEPALIVE_BINARY=/usr/sbin/wd_keepalive
RAOM_NATIVE_WATCHDOG_INIT=/usr/share/scr-raom/diverted/etc/init.d/watchdog
RAOM_WATCHDOG_BINARY=/usr/sbin/watchdog
RAOM_SYSLOG_INIT=/etc/init.d/rsyslog
RAOM_LOGGER=/usr/bin/logger
RAOM_NTP_INIT=/etc/init.d/ntp
RAOM_MONIT_PID_FILE=/run/monit.pid
RAOM_PROC_DIR=/proc
RAOM_MONIT_STATE_DIR=/var/lib/monit
RAOM_MONIT_LOG_DIR=/var/log
RAOM_HEALTH_DIR=/var/run

# Complete fallback uses these trusted profiles, never partial client values.
RAOM_DEFAULT_SAFE_PROFILE=/etc/monit/raom/safe.monitrc
RAOM_DEFAULT_NORMAL_PROFILE=/etc/monit/monitrc
