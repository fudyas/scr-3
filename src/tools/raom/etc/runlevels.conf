# Replace competing native startup links; retain scheduler identity "monit".
# Makefile mode calls patched init.d/monit after its existing prerequisites.
# Legacy mode follows these links directly to the RAOM service.
# Keep native stop links and all .depend.* files unchanged.
# Remove only the obsolete rcS.d/S17scr-resets-monitor observation link.
etc/rc2.d/S03monit=../init.d/scr-raom
etc/rc3.d/S03monit=../init.d/scr-raom
etc/rc4.d/S03monit=../init.d/scr-raom
etc/rc5.d/S03monit=../init.d/scr-raom
